<div class="form-group" data-background-volume>
    <label for="{{id}}">{{label}}</label>
    <div class="form-fields">
        <input id="{{id}}" name="{{name}}" type="range" value="{{value}}" min="0" max="1" step="0.05" data-dtype="Number" aria-describedby="{{id}}-hint"/>
        <span class="range-value">{{value}}</span>
    </div>
    <p class="hint" id="{{id}}-hint">{{hint}}</p>
</div>
